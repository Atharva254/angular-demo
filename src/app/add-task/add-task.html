<div class="add-task-container">
  <h2>Add New Task</h2>

  @if (showPopup()) {
    <div class="popup">
      {{popupMessage()}}
    </div>
  }
  <form (ngSubmit)="onSubmit()" #taskForm="ngForm" class="add-task-form">
    <!-- Task Name -->
    <div class="form-group">
      <label for="name">Task Name</label>
      <input
        type="text"
        id="name"
        name="name"
        required
        [(ngModel)]="task.name"
        placeholder="Enter task name"
      />
    </div>

    <!-- Description -->
    <div class="form-group">
      <label for="description">Description</label>
      <textarea
        id="description"
        name="description"
        rows="3"
        [(ngModel)]="task.description"
        placeholder="Enter task description"
      ></textarea>
    </div>

    <!-- Submit -->
    <button class="submit-btn" type="submit" [disabled]="!taskForm.form.valid">
      Add Task
    </button>
  </form>
</div>
